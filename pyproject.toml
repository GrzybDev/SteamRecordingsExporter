[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "steamrecordingsexporter"
version = "2.0.0"
description = "Tool to recover semi-corrupted Steam recordings and export Steam recordings without the Steam client"
authors = [
    {name = "Marek Grzyb",email = "marek@grzyb.dev"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[tool.uv]
package = true

[project.scripts]
steamrecordingsexporter = "steamrecordingsexporter.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF", "D"]
# Modules, packages and types say what they hold through their names; a type whose name
# does not gets a docstring by hand.
ignore = ["D100", "D101", "D104"]

[tool.ruff.lint.per-file-ignores]
# Test names say what each test proves.
"tests/**" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
files = ["src", "tests"]
strict = true
