[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "steamrecordingsexporter"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-ffmpeg>=2.0.12",
    "rich>=14.3.2",
    "typer>=0.21.1",
]

[tool.uv]
package = true

[project.scripts]
steamrecordingsexporter = "steamrecordingsexporter:app"
