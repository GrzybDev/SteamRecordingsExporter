name: Release Build

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version_type:
        type: choice
        description: 'Version Type'
        required: true
        default: rebuild
        options:
          - rebuild
          - patch
          - minor
          - major

jobs:
    bump_version:
        name: Bump Version
        runs-on: ubuntu-latest
        permissions:
          contents: write
        outputs:
          version: ${{ steps.bump.outputs.current-version }}
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Resolve release version
              id: bump
              shell: bash
              env:
                EVENT_NAME: ${{ github.event_name }}
                VERSION_TYPE: ${{ inputs.version_type }}
                RELEASE_TAG: ${{ github.ref_name }}
              run: |
                previous_version=$(uvx bump-my-version show current_version)
                if [[ "$EVENT_NAME" == "release" ]]; then
                  release_version="${RELEASE_TAG#v}"
                  if [[ "$release_version" != "$previous_version" ]]; then
                    uvx bump-my-version bump --no-commit --no-tag --no-push-tag --new-version "$release_version"
                  fi
                elif [[ "$VERSION_TYPE" != "rebuild" ]]; then
                  uvx bump-my-version bump --no-commit --no-tag --no-push-tag "$VERSION_TYPE"
                fi
                current_version=$(uvx bump-my-version show current_version)
                bumped=false
                if [[ "$current_version" != "$previous_version" ]]; then
                  bumped=true
                fi
                {
                  echo "previous-version=$previous_version"
                  echo "current-version=$current_version"
                  echo "bumped=$bumped"
                } >> "$GITHUB_OUTPUT"

            - name: Update lockfile
              run: uv lock

            - name: Commit version bump
              if: ${{ steps.bump.outputs.bumped == 'true' }}
              uses: EndBug/add-and-commit@v9
              with:
                default_author: github_actions
                message: "Bump version: ${{ steps.bump.outputs.previous-version }} → ${{ steps.bump.outputs.current-version }}"
                push: false # Push separately until EndBug/add-and-commit#713 is fixed.
                tag: "v${{ steps.bump.outputs.current-version }}"
                tag_push: "--force"

            - uses: ad-m/github-push-action@master
              name: Push changes
              if: ${{ steps.bump.outputs.bumped == 'true' }}
              with:
                force: true
                tags: true

    build:
        name: Build for ${{ matrix.osname }}
        permissions:
          contents: write
        runs-on: ${{ matrix.os }}
        needs: bump_version

        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      osname: Linux
                      osext: ""
                    - os: macos-latest
                      osname: macOS
                      osext: ""
                    - os: windows-latest
                      osname: Windows
                      osext: ".exe"

        steps:
            - uses: actions/checkout@v4
              if: ${{ github.event_name == 'release' || github.event.inputs.version_type == 'rebuild' }}

            - uses: actions/checkout@v4
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_type != 'rebuild' }}
              with:
                ref: v${{ needs.bump_version.outputs.version }}

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: 3.13

            - name: Install dependencies
              run: pip install .

            - id: repo_name
              name: Get repository name
              uses: ASzc/change-string-case-action@v6
              with:
                string: ${{ github.event.repository.name }}

            - name: Build executable
              uses: Nuitka/Nuitka-Action@main
              with:
                mode: onefile
                script-name: src/${{ steps.repo_name.outputs.lowercase }}
                output-dir: build
                output-file: ${{ github.event.repository.name }}_v${{ needs.bump_version.outputs.version }}_${{ matrix.osname }}
                company-name: ${{ github.repository_owner }}
                product-name: ${{ github.event.repository.name }}
                file-description: ${{ github.event.repository.name }} for ${{ matrix.osname }} (version ${{ needs.bump_version.outputs.version }})
                file-version: ${{ needs.bump_version.outputs.version }}
                product-version: ${{ needs.bump_version.outputs.version }}
                copyright: "Copyright (c) 2026 ${{ github.repository_owner }}"
                include-package: rich._unicode_data

            - name: Upload release (manual)
              if: ${{ github.event_name == 'release' && matrix.os != 'windows-latest' }}
              uses: softprops/action-gh-release@v2
              with:
                files: build/${{ github.event.repository.name }}_v${{ needs.bump_version.outputs.version }}_${{ matrix.osname }}${{ matrix.osext }}

            - name: Upload release
              if: ${{ github.event_name == 'workflow_dispatch' && matrix.os != 'windows-latest' }}
              uses: softprops/action-gh-release@v2
              with:
                files: build/${{ github.event.repository.name }}_v${{ needs.bump_version.outputs.version }}_${{ matrix.osname }}${{ matrix.osext }}
                tag_name: v${{ needs.bump_version.outputs.version }}

            - name: Upload windows release for code signing
              if: ${{ matrix.os == 'windows-latest' }}
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
                AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
              run: aws s3 cp ./build/${{ github.event.repository.name }}_v${{ needs.bump_version.outputs.version }}_${{ matrix.osname }}${{ matrix.osext }} s3://builds/unsigned/${{ github.event.repository.name }}/v${{ needs.bump_version.outputs.version }}/${{ github.event.repository.name }}_v${{ needs.bump_version.outputs.version }}_${{ matrix.osname }}${{ matrix.osext }}
