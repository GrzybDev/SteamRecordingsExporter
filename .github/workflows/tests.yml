name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Check the code
        run: uv run --locked ruff check

      - name: Check the formatting
        run: uv run --locked ruff format --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Check CLI entry points
        run: |
          uv run --locked steamrecordingsexporter --help
          uv run --locked python -m steamrecordingsexporter --help
